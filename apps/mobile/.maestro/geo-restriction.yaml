# Last step of the e2e chain (see executionOrder in config.yaml).
# Starts from the state send-asset left: an account exists and we're on the home tab.
# Injects a restricted store/device country via Dev config so /config returns
# enable_app_restrictions=true, then verifies the region-restricted screen replaces the app.
# The next full run's onboarding flow starts with clearState, wiping the injected country.
appId: com.safely.wallet
name: geo-restriction
tags:
    - smoke
    - geo
---
- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 30000
- tapOn:
      id: 'home.settingsButton'

# Open hidden dev tools (long-press the version label), then the Dev config screen.
- longPressOn:
      id: 'settings.devToolsTrigger'
- tapOn: 'Dev config'

# Force a restricted country and reload the app.
- tapOn:
      id: 'devTools.countryCode'
- inputText: 'GB'
- tapOn:
      id: 'devTools.saveAndReload'

# App relaunches restricted. With a passcode set, the lock screen shows first — unlock it.
- extendedWaitUntil:
      visible: '1'
      timeout: 60000
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- tapOn: '4'

# The region-restricted screen must be shown instead of the normal home.
- extendedWaitUntil:
      visible:
          id: 'restricted.screen'
      timeout: 30000
- assertVisible:
      id: 'restricted.screen'
- assertNotVisible:
      id: 'home.settingsButton'
