# Step 2 of the e2e chain: imports a wallet from MAESTRO_SEED_PHRASE.
# Starts from the state onboarding-create-wallet finished in:
# a created wallet on the home screen, passcode 1234, biometry skipped.
appId: com.aco.swallet
name: import-wallet
tags:
    - smoke
    - import
---
# Relaunch WITHOUT clearState — we continue on top of the previous flow's state.
- launchApp

- extendedWaitUntil:
      visible:
          id: 'home.walletSelector'
      timeout: 60000

# Wallet selector popup -> "Add wallet" -> "Import existing".
- tapOn:
      id: 'home.walletSelector'
- tapOn:
      id: 'accounts.addWallet'
- tapOn:
      id: 'addWallet.importExisting'

# The seed input autofocuses ~400ms after the screen gets focus —
# wait the transition out, then type into the focused field.
- extendedWaitUntil:
      visible:
          id: 'importWallet.continueButton'
      timeout: 15000
- waitForAnimationToEnd
- inputText: ${MAESTRO_SEED_PHRASE}

- tapOn:
      id: 'importWallet.continueButton'

# Customize step: the name is prefilled, just save.
- extendedWaitUntil:
      visible:
          id: 'customizeWallet.saveButton'
      timeout: 15000
- tapOn:
      id: 'customizeWallet.saveButton'

# Encrypting the imported secret requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- tapOn: '4'

# Import + initial sync, then navigation resets to home
# with the imported wallet active.
- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 60000

# Verify the import actually derived the right wallet: the address on the
# receive screen must match the one expected for MAESTRO_SEED_PHRASE.
- tapOn:
      id: 'home.receiveButton'
- extendedWaitUntil:
      visible:
          id: 'receive.address'
      timeout: 15000
- assertVisible:
      id: 'receive.address'
      text: ${MAESTRO_IMPORTED_WALLET_ADDRESS}
