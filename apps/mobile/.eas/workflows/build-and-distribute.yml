name: Build & Distribute to Firebase

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes / "What to Test" for testers
        type: string
        required: false
        default: ''
      pr_number:
        description: Just-merged PR number, used to build the PR link in the Slack report. Empty if none.
        type: string
        required: false
        default: ''
      repository:
        description: owner/repo, used to build the PR link in the Slack report
        type: string
        required: false
        default: ''
      target_branch:
        description: Branch the change was merged into (e.g. release/1.0.1), prefixed to the Slack notes
        type: string
        required: false
        default: ''

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
      message: ${{ inputs.release_notes }}

  build_android:
    name: Build APK
    type: build
    params:
      platform: android
      profile: production
      message: ${{ inputs.release_notes }}

  distribute_ios:
    type: testflight
    name: Upload to TestFlight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: ${{ inputs.release_notes }}

  # testflight upload may fail with unknown at this moment reasons, but retry should help
  distribute_ios_crutch:
    type: testflight
    name: Upload to TestFlight (crutch)
    after: [build_ios, distribute_ios]
    if: ${{ after.distribute_ios.status == 'failure' }}
    params:
      build_id: ${{ after.build_ios.outputs.build_id }}
      profile: production

  distribute_android:
    name: Upload to Firebase
    needs: [build_android]
    steps:
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        run: |
          echo '${{ env.SERVICE_ACCOUNT }}' > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json

          cat > /tmp/release_notes.txt << 'EAS_RELEASE_NOTES_EOF'
          ${{ inputs.release_notes }}
          EAS_RELEASE_NOTES_EOF

          APK_PATH=$(find ${{ steps.download_build.outputs.artifact_path }} -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No .apk file found in artifact. Contents:"
            ls -R ${{ steps.download_build.outputs.artifact_path }}
            exit 1
          fi

          NOTES_ARGS=()
          if [ -s /tmp/release_notes.txt ]; then
            NOTES_ARGS=(--release-notes-file /tmp/release_notes.txt)
          fi

          firebase appdistribution:distribute "$APK_PATH" \
            --app "${{ env.FIREBASE_APP_ID }}" \
            --groups "testers" \
            "${NOTES_ARGS[@]}"

  # Runs on the same APK we ship to Firebase (no separate e2e build),
  # in parallel with distribute_android.
  e2e_android:
    name: E2E (Maestro, Android)
    type: maestro
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: ['.maestro/onboarding-create-wallet.yaml']

  # Aggregates TestFlight + Firebase + e2e results into a Slack message.
  # `after` => runs regardless of upstream success/failure, and lets us read
  # both the statuses and the build outputs (version / build number).
  report:
    name: Report (Slack)
    after:
      - build_ios
      - build_android
      - distribute_ios
      - distribute_ios_crutch
      - distribute_android
      - e2e_android
    steps:
      # Custom steps jobs start with an empty workdir — check out the repo to reach the script.
      - uses: eas/checkout
      - name: Post report
        run: |
          export RELEASE_NOTES="${{ inputs.release_notes }}"
          export SLACK_WEBHOOK_URL="${{ env.SLACK_WEBHOOK_URL }}"
          export WORKFLOW_URL="${{ workflow.url }}"
          export PR_NUMBER="${{ inputs.pr_number }}"
          export REPOSITORY="${{ inputs.repository }}"
          export TARGET_BRANCH="${{ inputs.target_branch }}"
          export IOS_VERSION="${{ after.build_ios.outputs.app_version }}"
          export IOS_BUILD="${{ after.build_ios.outputs.app_build_version }}"
          export ANDROID_VERSION="${{ after.build_android.outputs.app_version }}"
          export ANDROID_BUILD="${{ after.build_android.outputs.app_build_version }}"
          export STATUS_IOS="${{ after.distribute_ios.status }}"
          export STATUS_IOS_CRUTCH="${{ after.distribute_ios_crutch.status }}"
          export STATUS_ANDROID="${{ after.distribute_android.status }}"
          export STATUS_E2E="${{ after.e2e_android.status }}"
          node scripts/eas-report.mjs
