name: Build & Distribute to Firebase

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes / "What to Test" for testers
        type: string
        required: false
        default: ''

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
      message: ${{ inputs.release_notes }}

  build_android:
    name: Build APK
    type: build
    params:
      platform: android
      profile: production
      message: ${{ inputs.release_notes }}

  distribute_ios:
    type: testflight
    name: Upload to TestFlight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: ${{ inputs.release_notes }}

  distribute_android:
    name: Upload to Firebase
    needs: [build_android]
    steps:
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        run: |
          echo '${{ env.SERVICE_ACCOUNT }}' > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json

          cat > /tmp/release_notes.txt << 'EAS_RELEASE_NOTES_EOF'
          ${{ inputs.release_notes }}
          EAS_RELEASE_NOTES_EOF

          APK_PATH=$(find ${{ steps.download_build.outputs.artifact_path }} -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No .apk file found in artifact. Contents:"
            ls -R ${{ steps.download_build.outputs.artifact_path }}
            exit 1
          fi

          NOTES_ARGS=()
          if [ -s /tmp/release_notes.txt ]; then
            NOTES_ARGS=(--release-notes-file /tmp/release_notes.txt)
          fi

          firebase appdistribution:distribute "$APK_PATH" \
            --app "${{ env.FIREBASE_APP_ID }}" \
            --groups "testers" \
            "${NOTES_ARGS[@]}"