name: Build & Distribute to Firebase

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build APK
    type: build
    params:
      platform: android
      profile: production

  distribute_ios:
    type: submit
    name: Upload to TestFlight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  distribute_android:
    name: Upload to Firebase
    needs: [build_android]
    steps:
      - uses: eas/download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        run: |
          firebase appdistribution:distribute ${{ steps.download_build.outputs.artifact_path }} \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "testers"