name: Build & Distribute to Firebase

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build APK
    type: build
    params:
      platform: android
      profile: production

  distribute_ios:
    type: submit
    name: Upload to TestFlight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  distribute_android:
    name: Upload to Firebase
    needs: [build_android]
    steps:
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        run: |
          APK_PATH=$(find ${{ steps.download_build.outputs.artifact_path }} -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No .apk file found in artifact. Contents:"
            ls -R ${{ steps.download_build.outputs.artifact_path }}
            exit 1
          fi
          firebase appdistribution:distribute "$APK_PATH" \
            --app "${{ env.FIREBASE_APP_ID }}" \
            --token "${{ env.FIREBASE_TOKEN }}" \
            --groups "testers"