name: CI

on:
  pull_request:
    branches:
      - master
      - 'release/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm compile

      - name: Lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm --filter "...[$BASE_SHA]" run lint

      - name: Test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm --filter "...[$BASE_SHA]" run test
