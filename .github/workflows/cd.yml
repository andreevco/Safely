name: CD

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - 'release/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release notes from PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // empty' || echo "")
          if [ -z "$PR" ]; then
            BRANCH="${GITHUB_REF_NAME}"
            NOTES=$(printf '[%s] %s' "$BRANCH" "${COMMIT_MESSAGE:-Build from ${GITHUB_SHA::7}}")
          else
            TITLE=$(printf '%s' "$PR" | jq -r '.title // ""')
            BODY=$(printf '%s' "$PR" | jq -r '.body // ""')
            NUMBER=$(printf '%s' "$PR" | jq -r '.number // ""')
            BRANCH=$(printf '%s' "$PR" | jq -r '.head.ref // ""')
            if [ -n "$BODY" ]; then
              NOTES=$(printf '[%s] #%s %s\n%s' "$BRANCH" "$NUMBER" "$TITLE" "$BODY")
            else
              NOTES=$(printf '[%s] #%s %s' "$BRANCH" "$NUMBER" "$TITLE")
            fi
          fi

          # Expose the just-merged PR number (empty for direct pushes / manual runs)
          # so the EAS report can link to it in Slack — works for any trigger/branch.
          echo "PR_NUMBER=${NUMBER:-}" >> "$GITHUB_ENV"
          # EAS Workflows doesn't quote-safe-interpolate inputs into its internal bash;
          # unescaped () ` $ " ' \ in changelog cause exit 141 / SIGPIPE / empty log.
          NOTES=$(printf '%s' "$NOTES" \
            | tr -d '\r' \
            | tr '\n' ' ' \
            | tr '(' '[' \
            | tr ')' ']' \
            | sed "s/[\`\$\"'\\\\]//g" \
            | tr -s ' ')
          # TestFlight "What to Test" caps at 4000 chars
          printf '%s' "$NOTES" | head -c 4000 > /tmp/release_notes.txt
          echo "----- release notes -----"
          cat /tmp/release_notes.txt
          echo
          echo "-------------------------"

      - name: Build mobile
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          RELEASE_NOTES="$(cat /tmp/release_notes.txt)"
          # Cache only feature builds (release/*); master stays uncached for clean from-scratch builds.
          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            ANDROID_BUILD_PROFILE="production-cached"
          else
            ANDROID_BUILD_PROFILE="production"
          fi
          pnpm dlx eas-cli workflow:run build-and-distribute.yml \
            --input release_notes="$RELEASE_NOTES" \
            --input pr_number="${PR_NUMBER:-}" \
            --input repository="${{ github.repository }}" \
            --input target_branch="$GITHUB_REF_NAME" \
            --input android_build_profile="$ANDROID_BUILD_PROFILE"
