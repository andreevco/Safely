packages:
  - 'packages/*'
  - 'apps/*'
  # native addons belong to their app, but must be workspace packages so pnpm links them into
  # node_modules — where node-gyp, @electron/rebuild and the packager look for them
  - 'apps/desktop/native/*'

catalog:
  zod: '4.4.1'
  big.js: '^7.0.1'
  cbor-x: "^1.6.4"
  '@noble/hashes': '2.2.0'
  '@noble/curves': '2.2.0'
  '@types/big.js': '^6.2.2'
  react: '19.2.3'
  react-dom: '19.2.3'
  '@types/react': '19.2.14'
  '@types/react-dom': '19.2.3'
  '@tanstack/react-query': '^5.90.16'
  '@tanstack/query-async-storage-persister': '^5.90.18'
  '@tanstack/react-query-persist-client': '^5.90.18'
  xstate: '^5.26.0'
  '@xstate/react': '^6.1.0'
  zustand: '^5.0.0'
  typescript: '~6.0.3'
  eslint: '^9.39.2'
  '@eslint/js': '^9.39.2'
  eslint-plugin-react-hooks: '^7.0.1'
  typescript-eslint: '^8.58.0'
  uuid: "^14.0.0"
  '@ledgerhq/device-management-kit': '^1.5.1'
  '@ledgerhq/device-signer-kit-bitcoin': '^1.3.1'
  '@ledgerhq/signer-utils': '^1.2.0'
  # i18n: the strings live in @safely/ux, each app creates its own i18next instance
  i18next: '^26.3.0'
  react-i18next: '^17.0.8'
  # shared by packages/web-ui and every web target (apps/desktop, later apps/browser).
  # Pinned to 6.x on purpose: electron-forge 7 is published as CommonJS and does
  # `require('vite')`, while vite 7 dropped the `require` export condition.
  vite: '6.4.3'

minimumReleaseAge: 5760

# Already pnpm's default — stated explicitly because electron-forge refuses to
# package unless `hoist-pattern` or `public-hoist-pattern` is set (or node-linker is
# "hoisted", which would change resolution for the whole workspace, mobile included).
# The layout is therefore unchanged; only forge's preflight check is satisfied.
hoistPattern:
  - '*'

strictPeerDependencies: false
autoInstallPeers: true

# `@electron/rebuild@3.7.x` (a transitive dependency of electron-forge 7) declares
# `@electron/node-gyp` as a git URL, which `blockExoticSubdeps` rightly refuses. The
# same fork is published to the registry, so pin it there instead of switching the
# guard off for the whole workspace. Nothing in this repo has native modules to
# rebuild, so this dependency is never executed — it only has to resolve.
overrides:
  '@electron/rebuild>@electron/node-gyp': '10.2.0-electron.2'

peerDependencyRules:
  allowedVersions:
    react-native-ble-plx: '>=3.4.0'
    typescript: '>=6.0.0'

allowBuilds:
  electron: true
  '@shopify/react-native-skia': true
  cbor-extract: false
  msgpackr-extract: false
  unrs-resolver: false
  esbuild: false
  dtrace-provider: false
  react-native-inappbrowser-reborn: true

patchedDependencies:
  expo-blur@15.0.8: patches/expo-blur@15.0.8.patch
